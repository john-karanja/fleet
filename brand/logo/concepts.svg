rial,sans-serif" font-size="19" fill="#555">starts and ends with the county.</text><rect x="1065.33" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><title>CVFMS concept C</title><rect x="28" y="28" width="56" height="56" rx="12"/><rect x="100" y="28" width="56" height="56" rx="12"/><rect x="28" y="100" width="56" height="56" rx="12"/><rect x="28" y="172" width="56" height="56" rx="12"/><rect x="100" y="172" width="56" height="56" rx="12"/><rect x="172" y="172" width="56" height="56" rx="12"/><circle cx="200.0" cy="56.0" r="28.0"/></svg></g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet"><title>CVFMS concept C</title><rect x="28" y="28" width="56" height="56" rx="12"/><rect x="100" y="28" width="56" height="56" rx="12"/><rect x="28" y="100" width="56" height="56" rx="12"/><rect x="28" y="172" width="56" height="56" rx="12"/><rect x="100" y="172" width="56" height="56" rx="12"/><rect x="172" y="172" width="56" height="56" rx="12"/><circle cx="200.0" cy="56.0" r="28.0"/></svg></g><text x="1127.33" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1185.33" y="548" width="32" height="32" preserveAspectRatio="xMidYMid meet"><title>CVFMS concept C</title><rect x="28" y="28" width="56" height="56" rx="12"/><rect x="100" y="28" width="56" height="56" rx="12"/><rect x="28" y="100" width="56" height="56" rx="12"/><rect x="28" y="172" width="56" height="56" rx="12"/><rect x="100" y="172" width="56" height="56" rx="12"/><rect x="172" y="172" width="56" height="56" rx="12"/>